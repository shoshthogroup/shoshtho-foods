{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h3 class="fw-bold text-center mb-4">📝 Register</h3>
            <form method="POST" action="/register">

                <div class="mb-3">
                    <label class="form-label fw-bold">আপনার নাম</label>
                    <input type="text" name="name" 
                           class="form-control" 
                           placeholder="পূর্ণ নাম" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" 
                           class="form-control" 
                           placeholder="Email address" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">ফোন নম্বর</label>
                    <input type="text" name="phone" 
                           class="form-control" 
                           placeholder="01XXXXXXXXX" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" 
                           class="form-control" 
                           placeholder="Password" required>
                </div>

                <button type="submit" 
                        class="btn btn-primary w-100 btn-lg">
                    Register করুন
                </button>
            </form>
            <hr>
            <p class="text-center mb-0">
                আগে থেকে Account আছে?
                <a href="/login" class="text-success fw-bold">
                    Login করুন
                </a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
