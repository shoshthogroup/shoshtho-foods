{% extends 'base.html' %}
{% block content %}

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow p-4">
                <h3 class="fw-bold mb-4">✏️ Craft Item Edit করুন</h3>
                <form method="POST"
                      action="/admin/craft/edit/{{ item.id }}"
                      enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label fw-bold">নাম</label>
                        <input type="text" name="name"
                               class="form-control"
                               value="{{ item.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            বিবরণ
                        </label>
                        <textarea name="description"
                                  class="form-control"
                                  rows="3">
                            {{ item.description }}
                        </textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            দাম (৳)
                        </label>
                        <input type="number" name="price"
                               class="form-control"
                               value="{{ item.price }}"
                               step="0.01" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Category
                        </label>
                        <select name="category" class="form-select">
                            <option value="Men"
                                {{ 'selected' if item.category=='Men' }}>
                                Men's Wear
                            </option>
                            <option value="Women"
                                {{ 'selected' if item.category=='Women' }}>
                                Women's Wear
                            </option>
                            <option value="Child"
                                {{ 'selected' if item.category=='Child' }}>
                                Children's Wear
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            বর্তমান ছবি
                        </label>
                        {% if item.image_url %}
                        <div>
                            <img src="{{ item.image_url }}"
                                 width="120" height="120"
                                 style="object-fit:cover;
                                        border-radius:10px;">
                        </div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            নতুন ছবি Upload
                        </label>
                        <input type="file" name="image"
                               class="form-control"
                               accept="image/*">
                    </div>

                    <div class="mb-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="is_available"
                                   {{ 'checked' if item.is_available }}>
                            <label class="form-check-label fw-bold">
                                Available
                            </label>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit"
                                class="btn btn-warning btn-lg flex-grow-1 fw-bold">
                            ✅ Update করুন
                        </button>
                        <a href="/admin/craft"
                           class="btn btn-outline-secondary btn-lg">
                            বাতিল
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
