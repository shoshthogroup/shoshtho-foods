{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <div class="container d-flex justify-content-between
                align-items-center">
        <h2>🖼️ Banner Management</h2>
        <div>
            <a href="/admin/banner/add"
               class="btn btn-success me-2">
                + নতুন Banner
            </a>
            <a href="/admin"
               class="btn btn-outline-primary">← Dashboard</a>
        </div>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ছবি</th>
                        <th>Title</th>
                        <th>Page</th>
                        <th>Type</th>
                        <th>Active</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for b in banners %}
                    <tr>
                        <td>
                            {% if b.image_url %}
                            <img src="{{ b.image_url }}"
                                 width="80" height="50"
                                 style="object-fit:cover;
                                        border-radius:6px;">
                            {% else %}
                            <div style="width:80px;height:50px;
                                 background:{{ b.bg_color }};
                                 border-radius:6px;
                                 display:flex;align-items:center;
                                 justify-content:center;
                                 font-size:1.5rem;">
                                {{ b.emoji }}
                            </div>
                            {% endif %}
                        </td>
                        <td class="fw-bold">{{ b.title }}</td>
                        <td>
                            <span class="badge
                                {% if b.page=='food' %}bg-success
                                {% else %}bg-purple{% endif %}">
                                {{ b.page }}
                            </span>
                        </td>
                        <td>{{ b.banner_type }}</td>
                        <td>
                            <form method="POST"
                                  action="/admin/banner/toggle/{{ b.id }}">
                                <button class="btn btn-sm
                                    {% if b.is_active %}btn-success
                                    {% else %}btn-secondary{% endif %}">
                                    {% if b.is_active %}✅ Active
                                    {% else %}❌ Off{% endif %}
                                </button>
                            </form>
                        </td>
                        <td>
                            <form method="POST"
                                  action="/admin/banner/delete/{{ b.id }}"
                                  onsubmit="return confirm('মুছবেন?')">
                                <button class="btn btn-sm btn-danger">
                                    🗑️
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
