{% extends 'base.html' %}
{% block content %}

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow p-4">
                <h3 class="fw-bold mb-4">
                    🍱 নতুন খাবার যোগ করুন
                </h3>
                <form method="POST" action="/admin/food/add"
                      enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            নাম *
                        </label>
                        <input type="text" name="name"
                               class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            বিবরণ
                        </label>
                        <textarea name="description"
                                  class="form-control"
                                  rows="3"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">
                                দাম (৳) *
                            </label>
                            <input type="number" name="price"
                                   class="form-control"
                                   step="0.01" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">
                                আগের দাম (৳)
                            </label>
                            <input type="number"
                                   name="old_price"
                                   class="form-control"
                                   step="0.01"
                                   placeholder="Optional">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Offer Badge
                        </label>
                        <input type="text" name="badge"
                               class="form-control"
                               placeholder="যেমন: New, Hot, -20%, Best Seller">
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">
                                Category
                            </label>
                            <input type="text" name="category"
                                   class="form-control"
                                   placeholder="Food">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">
                                Sub Category
                            </label>
                            <select name="sub_category"
                                    class="form-select">
                                <option value="">-- সিলেক্ট --</option>
                                <option value="Organic">Organic</option>
                                <option value="Fresh">Fresh</option>
                                <option value="Snacks">Snacks</option>
                                <option value="Drinks">Drinks</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            ছবি Upload
                        </label>
                        <input type="file" name="image"
                               class="form-control"
                               accept="image/*">
                    </div>

                    <div class="row mb-3">
                        <div class="col-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input"
                                       type="checkbox"
                                       name="is_featured"
                                       checked>
                                <label class="form-check-label fw-bold">
                                    Featured Product
                                </label>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">
                                Sort Order
                            </label>
                            <input type="number"
                                   name="sort_order"
                                   class="form-control"
                                   value="0">
                        </div>
                    </div>

                    <button type="submit"
                            class="btn btn-success w-100 btn-lg">
                        ✅ খাবার যোগ করুন
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
